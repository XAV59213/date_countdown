name: Cleanup structure

on:
  workflow_dispatch:
  push:
    branches: [chore/cleanup-single-integration]
    paths:
      - ".github/workflows/cleanup-structure.yml"

permissions:
  contents: write

concurrency:
  group: cleanup-structure
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Merge hyphen folder into date_countdown and remove leftovers
        run: |
          set -euo pipefail
          SRC=custom_components/date-countdown
          DST=custom_components/date_countdown
          mkdir -p "$DST/brand" "$DST/translations"

          if [ -d "$SRC" ]; then
            for f in const.py sensor.py calendar.py config_flow.py strings.json translations/fr.json; do
              if [ -f "$SRC/$f" ]; then
                cp -f "$SRC/$f" "$DST/$f"
              fi
            done
            if [ -f "$SRC/__init__.py" ] && [ ! -s "$DST/__init__.py" ]; then
              cp -f "$SRC/__init__.py" "$DST/__init__.py"
            fi
            rm -rf "$SRC"
          fi

          rm -f .github/workflows/normalize-brand.yml
          rm -f .github/workflows/cleanup-structure.yml

          # Keep README brand assets at repo root; integration brand only needs icon.png
          rm -f "$DST/brand/icon.svg" || true

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: une seule intégration date_countdown + suppression du dossier tiret"
          git push
