name: Publish 1.2.9

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-1-2-9.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release 1.2.9
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.2.9"
          name: "1.2.9"
          target_commitish: main
          generate_release_notes: true
          body: |
            Souvenirs et Célébrations 1.2.9

            - Structure HACS unique (`custom_components/date_countdown`)
            - Icône / logo HACS
            - Dépôt renommé `XAV59213/date_countdown`
            - Validation HACS + hassfest au vert
