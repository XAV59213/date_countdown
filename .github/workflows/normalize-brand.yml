name: Normalize brand assets

on:
  push:
    paths:
      - "brand/IMG_*.jpeg"
      - "brand/IMG_*.jpg"
      - "brand/IMG_*.png"
      - ".github/workflows/normalize-brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert and rename brand images
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p brand custom_components/date_countdown/brand custom_components/date-countdown/brand

          ICON_SRC=""
          LOGO_SRC=""
          if [ -f brand/IMG_7242.jpeg ]; then ICON_SRC=brand/IMG_7242.jpeg; fi
          if [ -f brand/IMG_7241.jpeg ] && [ -z "$ICON_SRC" ]; then ICON_SRC=brand/IMG_7241.jpeg; fi
          if [ -f brand/IMG_7240.jpeg ]; then LOGO_SRC=brand/IMG_7240.jpeg; fi

          if [ -n "$ICON_SRC" ]; then
            convert "$ICON_SRC" -resize 512x512^ -gravity center -extent 512x512 PNG32:brand/icon.png
            cp brand/icon.png custom_components/date_countdown/brand/icon.png
            cp brand/icon.png custom_components/date-countdown/brand/icon.png
          fi
          if [ -f brand/IMG_7241.jpeg ]; then
            convert brand/IMG_7241.jpeg -resize 256x256^ -gravity center -extent 256x256 PNG32:brand/icon-256.png
          fi
          if [ -n "$LOGO_SRC" ]; then
            convert "$LOGO_SRC" PNG32:brand/logo.png
            cp brand/logo.png custom_components/date_countdown/brand/logo.png || true
          fi

          rm -f brand/IMG_7240.jpeg brand/IMG_7241.jpeg brand/IMG_7242.jpeg

      - name: Commit renamed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand custom_components/date_countdown/brand custom_components/date-countdown/brand
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: rename IMG_* to icon.png and logo.png"
          git push
